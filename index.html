<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>سكينة — قراءة التعبير</title>
<style>
  :root{--bg:#0f1115;--card:#181c24;--txt:#eef1f6;--mut:#8e97a8;--acc:#6ea8fe;--err:#ff7b72}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font-family:system-ui,"Segoe UI",Tahoma,sans-serif;
       display:flex;flex-direction:column;align-items:center;gap:16px;padding:20px}
  #cam{width:280px;height:280px;border-radius:20px;overflow:hidden;background:#000;
       display:flex;align-items:center;justify-content:center;position:relative}
  #cam video,#cam canvas{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
  .card{background:var(--card);border-radius:16px;padding:16px;width:min(420px,100%)}
  .row{display:flex;align-items:center;gap:10px;margin:8px 0}
  .row>span:first-child{width:88px;font-size:14px;color:var(--mut)}
  .track{flex:1;height:8px;background:#262c38;border-radius:99px;overflow:hidden}
  .fill{display:block;height:100%;width:0;background:var(--acc);
        transition:width .35s cubic-bezier(.4,0,.2,1)}
  .pct{width:44px;text-align:end;font-size:13px;color:var(--mut);
       font-variant-numeric:tabular-nums}
  #status{font-size:15px;color:var(--mut);min-height:22px;text-align:center;
          max-width:440px;line-height:1.7}
  #status.err{color:var(--err)}
  #result{display:none;text-align:center}
  #result.on{display:block}
  #result h2{margin:0 0 6px;font-size:28px}
  button{background:var(--acc);color:#0f1115;border:0;border-radius:12px;
         padding:12px 22px;font-size:16px;font-weight:600;cursor:pointer}
  button.ghost{background:#262c38;color:var(--txt)}
</style>
</head>
<body>

  <div id="cam"><video id="video" playsinline muted autoplay></video></div>
  <div id="status">جارٍ التحضير…</div>

  <div class="card" id="bars"></div>

  <div class="card" id="result">
    <h2 id="rLabel">—</h2>
    <div id="rConf" style="color:var(--mut);font-size:14px"></div>
    <img id="rShot" alt="" style="width:120px;border-radius:12px;margin:12px 0">
    <div><button id="restart" class="ghost">إعادة المحاولة</button></div>
  </div>

<!-- tfjs 4.x — matches the version your model was exported with -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>

<script>
/* =========================================================================
   Sakina — Face Expression Capture & Lock  (سكينة)

   Runs a MediaTrainer-exported model (format: mediatrainer-model-v1):
     camera frame -> 224x224 -> x/127.5-1
                  -> MobileNet v1 0.25_224, layer conv_pw_13_relu
                  -> global average pool (256-d embedding)
                  -> your trained head (model.json + weights.bin)
                  -> softmax over the labels in metadata.json

   Prediction is SMOOTHED over a rolling window, then LOCKED once stable.
   Only restart() releases the lock. Nothing leaves the device.
   ========================================================================= */
const SakinaFace = (() => {
  const CFG = {
    MODEL_URL:     "./model/",   // must contain model.json, metadata.json, weights.bin
    FPS:           5,
    WINDOW:        15,           // ~3 seconds of history
    MIN_CONF:      0.70,
    MIN_MARGIN:    0.15,
    STABLE_FRAMES: 8,
    MAX_SCAN_MS:   15000,
    SIZE:          224
  };

  const STATE = { IDLE:"idle", SCANNING:"scanning", LOCKED:"locked" };

  // Arabic display names, matched case-insensitively against the model labels
  const AR_MATCH = [
    [/sad|حزن/i,          "حزن"],
    [/happy|سعاد|سعيد/i,  "سعادة"],
    [/angry|غضب/i,        "غضب"]
  ];
  const toArabic = l => (AR_MATCH.find(([re])=>re.test(l))||[,l])[1];
  const isNegative = l => /sad|angry|حزن|غضب/i.test(l);

  let base=null, head=null, labels=[], stream=null, video=null;
  let work=null, wctx=null;                       // offscreen 224x224 canvas
  let state=STATE.IDLE, rafId=null, lastTick=0, scanStart=0;
  let buffer=[], stableCount=0, stableLabel=null;
  let capture=null;

  const listeners={tick:[],lock:[],restart:[],error:[]};
  const emit=(ev,d)=>listeners[ev].forEach(f=>{try{f(d)}catch(e){console.error(e)}});

  // ------------------------------ INIT ----------------------------------
  async function init(videoEl, onProgress=()=>{}){
    if(typeof tf==="undefined") throw new Error("لم تُحمَّل مكتبة TensorFlow.js");
    if(!navigator.mediaDevices?.getUserMedia)
      throw new Error("الكاميرا غير متاحة — افتح الصفحة عبر http/https وليس file://");
    if(head) return;

    video = videoEl;

    // 1) metadata (labels + base network description)
    onProgress("قراءة إعدادات النموذج…");
    const metaRes = await fetch(CFG.MODEL_URL+"metadata.json");
    if(!metaRes.ok) throw new Error("لم يُعثر على metadata.json داخل مجلد model/");
    const meta = await metaRes.json();
    labels = meta.labels;
    if(!Array.isArray(labels)||!labels.length)
      throw new Error("metadata.json لا يحتوي على labels");
    CFG.SIZE = meta.imageSize || 224;

    // 2) base feature extractor, truncated at the embedding layer
    onProgress("تحميل الشبكة الأساسية…");
    const baseUrl   = meta.base?.url ||
      "https://storage.googleapis.com/tfjs-models/tfjs/mobilenet_v1_0.25_224/model.json";
    const embedName = meta.base?.embedLayer || "conv_pw_13_relu";
    const full = await tf.loadLayersModel(baseUrl);
    base = tf.model({ inputs: full.inputs,
                      outputs: full.getLayer(embedName).output });

    // 3) your trained head
    onProgress("تحميل النموذج المدرَّب…");
    head = await tf.loadLayersModel(CFG.MODEL_URL+"model.json");

    // warm up so the first real prediction isn't slow
    tf.tidy(()=>{ head.predict(base.predict(tf.zeros([1,CFG.SIZE,CFG.SIZE,3]))
                                   .mean([1,2])).dataSync(); });

    // 4) camera
    onProgress("تشغيل الكاميرا…");
    stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:"user", width:{ideal:640}, height:{ideal:640} }, audio:false });
    video.srcObject = stream;
    await video.play();

    work = document.createElement("canvas");
    work.width = work.height = CFG.SIZE;
    wctx = work.getContext("2d", { willReadFrequently:true });
  }

  // --------------------------- SCAN / PREDICT ---------------------------
  async function start(){
    if(state===STATE.LOCKED) return;              // must restart() first
    if(!head) throw new Error("call SakinaFace.init() first");
    resetBuffers();
    state=STATE.SCANNING; scanStart=performance.now(); lastTick=0;
    if(video.paused) await video.play();
    rafId=requestAnimationFrame(loop);
  }

  function loop(now){
    if(state!==STATE.SCANNING) return;
    rafId=requestAnimationFrame(loop);
    if(now-lastTick < 1000/CFG.FPS) return;
    lastTick=now;
    predictOnce().catch(e=>emit("error",e));
  }

  function grabFrame(){
    // center-crop the video to a square, then draw at 224x224
    const vw=video.videoWidth, vh=video.videoHeight;
    if(!vw||!vh) return false;
    const s=Math.min(vw,vh), sx=(vw-s)/2, sy=(vh-s)/2;
    wctx.save();
    wctx.translate(CFG.SIZE,0); wctx.scale(-1,1);   // mirror (front camera)
    wctx.drawImage(video, sx,sy,s,s, 0,0, CFG.SIZE,CFG.SIZE);
    wctx.restore();
    return true;
  }

  async function predictOnce(){
    if(!grabFrame()) return;

    const probs = tf.tidy(()=>{
      const img = tf.browser.fromPixels(work).toFloat()
                    .div(127.5).sub(1).expandDims(0);   // x/127.5 - 1
      const embedding = base.predict(img).mean([1,2]);   // global average pool -> [1,256]
      return head.predict(embedding);
    });
    const values = await probs.data();
    probs.dispose();

    const raw = labels.map((className,i)=>({className, probability:values[i]}));

    buffer.push(raw);
    if(buffer.length>CFG.WINDOW) buffer.shift();

    // ---- smoothing: average each class over the window ----
    const avg={};
    labels.forEach(l=>{ avg[l]=0; });
    buffer.forEach(fr=>fr.forEach(p=>{ avg[p.className]+=p.probability/buffer.length; }));

    const ranked=Object.entries(avg).map(([label,score])=>({label,score}))
                                    .sort((a,b)=>b.score-a.score);
    const top=ranked[0], second=ranked[1]||{score:0};
    const margin=top.score-second.score;

    emit("tick",{ranked, top:top.label, confidence:top.score, margin,
                 progress:Math.min(1,stableCount/CFG.STABLE_FRAMES),
                 warmingUp:buffer.length<CFG.WINDOW});

    if(buffer.length<CFG.WINDOW) return;

    // ---- stability gate ----
    const good = top.score>=CFG.MIN_CONF && margin>=CFG.MIN_MARGIN;
    if(good && top.label===stableLabel)   stableCount++;
    else if(good){ stableLabel=top.label; stableCount=1; }
    else                                  stableCount=Math.max(0,stableCount-1);

    if(stableCount>=CFG.STABLE_FRAMES) return lock(top.label,top.score,avg,false);
    if(performance.now()-scanStart>CFG.MAX_SCAN_MS)
      return lock(top.label,top.score,avg,true);
  }

  // ------------------------------ LOCK ----------------------------------
  function lock(label,confidence,scores,uncertain){
    state=STATE.LOCKED;
    cancelAnimationFrame(rafId); rafId=null;

    let imageDataUrl=null;
    try{ imageDataUrl=work.toDataURL("image/jpeg",0.85); }catch(e){}
    video.pause();                     // camera freezes, bar stops moving

    capture={ label, labelAr:toArabic(label), negative:isNegative(label),
              confidence, scores, imageDataUrl,
              timestamp:Date.now(), uncertain };
    emit("lock",capture);
  }

  // ----------------------------- RESTART --------------------------------
  async function restart(){
    capture=null; resetBuffers(); state=STATE.IDLE;
    emit("restart",null);
    await start();
  }

  function resetBuffers(){ buffer=[]; stableCount=0; stableLabel=null; }
  function stop(){ if(rafId)cancelAnimationFrame(rafId); rafId=null;
                   state=STATE.IDLE; if(video)video.pause(); }
  function dispose(){ stop(); stream?.getTracks().forEach(t=>t.stop());
                      base?.dispose(); head?.dispose(); capture=null; }

  return { init,start,restart,stop,dispose,
           on:(ev,fn)=>{ if(listeners[ev])listeners[ev].push(fn); },
           get result(){ return capture; },
           get labels(){ return labels.slice(); },
           get state(){ return state; },
           get isLocked(){ return state===STATE.LOCKED; },
           toArabic, CFG };
})();
</script>

<script>
const $ = s => document.querySelector(s);
const bars = {};

function say(msg,isErr){
  $('#status').textContent=msg;
  $('#status').classList.toggle('err',!!isErr);
}

function bar(label){
  if(bars[label]) return bars[label];
  const row=document.createElement('div'); row.className='row';
  row.innerHTML=`<span>${SakinaFace.toArabic(label)}</span>
                 <span class="track"><span class="fill"></span></span>
                 <span class="pct">0%</span>`;
  $('#bars').appendChild(row);
  return bars[label]={fill:row.querySelector('.fill'), pct:row.querySelector('.pct')};
}

SakinaFace.on('tick', d=>{
  d.ranked.forEach(({label,score})=>{
    const b=bar(label);
    b.fill.style.width=(score*100).toFixed(0)+'%';
    b.pct.textContent =(score*100).toFixed(0)+'%';
  });
  say(d.warmingUp ? 'ابقَ ثابتًا أمام الكاميرا…'
                  : `يقرأ التعبير… ${(d.progress*100).toFixed(0)}%`);
});

SakinaFace.on('lock', r=>{
  say(r.uncertain ? 'القراءة غير واضحة — هذا أقرب احتمال' : 'تم التقاط التعبير');
  $('#rLabel').textContent=r.labelAr;
  $('#rConf').textContent ='الثقة: '+(r.confidence*100).toFixed(0)+'%';
  if(r.imageDataUrl) $('#rShot').src=r.imageDataUrl;
  $('#result').classList.add('on');
  $('#bars').style.opacity=.45;

  // >>> hand off to the conversation flow:
  // if(r.negative) startTherapeuticChat(r.label, r.confidence);
});

SakinaFace.on('restart', ()=>{
  $('#result').classList.remove('on');
  $('#bars').style.opacity=1;
});
SakinaFace.on('error', e=>{ console.error(e); say('خطأ أثناء التحليل: '+e.message,true); });

$('#restart').onclick=()=>SakinaFace.restart();

(async()=>{
  if(location.protocol==='file:'){
    say('افتح الصفحة عبر خادم محلي (http://localhost) — الكاميرا لا تعمل من file://',true);
    return;
  }
  try{
    await SakinaFace.init($('#video'), msg=>say(msg));
    await SakinaFace.start();
  }catch(e){
    console.error(e);
    say('تعذّر البدء: '+e.message,true);
  }
})();
</script>
</body>
</html>
